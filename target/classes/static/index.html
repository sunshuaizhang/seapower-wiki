<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Sea Power · 离线百科</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
    <div class="brand">
        <span class="insignia">⚓</span>
        <span class="title">SEA POWER · FIELD INTEL</span>
        <span class="subtitle" id="metaInfo"></span>
    </div>
    <div class="controls">
        <div class="tabs" id="catTabs">
            <button class="tab active" data-cat="vessels">舰艇</button>
            <button class="tab" data-cat="aircraft">飞机</button>
            <button class="tab" data-cat="land_units">陆战单位</button>
            <button class="tab" data-cat="ammunition">武器弹药</button>
        </div>
        <select id="lang" class="lang-select">
            <option value="cn">中文</option>
            <option value="en">English</option>
            <option value="ru">Русский</option>
            <option value="de">Deutsch</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="vn">Tiếng Việt</option>
        </select>
    </div>
</header>

<main class="layout">
    <aside class="sidebar">
        <div class="searchbar">
            <input type="search" id="search" placeholder="搜索  ID / 名称 / 型号">
        </div>
        <div class="filters">
            <label>国家</label>
            <select id="filterNation"><option value="">全部</option></select>
            <label>类型</label>
            <select id="filterType"><option value="">全部</option></select>
        </div>
        <div class="counter" id="counter"></div>
        <div class="list" id="list"></div>
    </aside>

    <section class="detail" id="detail">
        <div class="placeholder">
            <div class="placeholder-grid"></div>
            <div class="placeholder-text">
                <p class="op">[ 待命 ]</p>
                <p>从左侧选择单位以展示情报概览。</p>
                <p class="dim">数据源: <code id="srcPath"></code></p>
            </div>
        </div>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
