server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: sea-power-wiki

game:
  # Sea Power StreamingAssets directory. Must contain original/ subdir.
  streaming-assets: D:/SteamLibrary/steamapps/common/Sea Power/Sea Power_Data/StreamingAssets
  default-language: cn
  # When true, uses file mtime cache. Set false for mod/debug work.
  cache-enabled: true
  # Directory that holds the Unity .assets files (parent of StreamingAssets).
  data-dir: D:/SteamLibrary/steamapps/common/Sea Power/Sea Power_Data

images:
  enabled: true
  # Directory for PNGs extracted from the Unity assets. Auto-created.
  cache-dir: ${user.dir}/cache/images
  # Python executable used for the UnityPy daemon.
  python-bin: python
  # Path to the daemon script, relative to project root.
  script: scripts/unity_extractor.py
  # Daemon startup timeout in seconds.
  startup-timeout-sec: 60
  # Request timeout (per extract call).
  request-timeout-sec: 30

app:
  cors:
    # Comma-separated origins allowed to call /api/**. The frontend dev server
    # (Vite) runs on 5173 by default; add your production frontend URL here.
    allowed-origins: http://localhost:5173,http://localhost:3000

logging:
  level:
    com.seapower.wiki: INFO
    org.springframework: WARN
